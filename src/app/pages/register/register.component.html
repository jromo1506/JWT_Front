<div @fadeIn class="w-full min-h-screen bg-slate-900">
    <form [formGroup]="formRegister" (ngSubmit)="onSubmit()"  class="w-full flex flex-col justify-center  items-center">

        <div  class="bg-white w-[40%] flex flex-col items-center my-[10%] p-9 text-sm">
            <div class="text-4xl mb-4">
                <h1>Create account</h1>
            </div>
            
            
            <div class="my-2 w-[70%] ">
                <label>Username<br>
                    <input type="text" class="w-full" formControlName="username">
                </label>
            </div>
            <div class="my-2 w-[70%] ">
                <label>
                    Email<br>
                    <input type="email" class="w-full" formControlName="email">

                </label>
            </div>
            <div class="my-2 w-[70%] ">
                <label>
                    Password<br>
                    <input type="password" class="w-full" formControlName="password">

                </label>
            </div>
  
            <div class="my-2 w-[70%] ">
                <label>
                    Repeat password<br>
                        <input type="password" class="w-full" formControlName="repeatPassword">

                </label>
            </div><br>
            <div>
                <button type="submit" [disabled]="!formRegister.valid" class="bg-blue-950 py-2 hover:bg-yellow-600 hover:cursor-pointer text-white px-5">Enviar</button>

            </div>

        </div>
    </form>
</div>
